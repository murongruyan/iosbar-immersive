name: Build module

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships cmdline-tools; android-actions/setup-android now dies on
      # `sdkmanager tools` (Google removed that package), so the platform packages are installed
      # straight from the preinstalled SDK instead.
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$MANAGER" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          echo "Using sdkmanager: $MANAGER"
          yes | "$MANAGER" --licenses >/dev/null 2>&1 || true
          PACKAGES=(platform-tools "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0")
          "$MANAGER" "${PACKAGES[@]}" || "$MANAGER" --channel=3 "${PACKAGES[@]}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build and verify LSPosed APK
        shell: pwsh
        run: ./build_apk.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/dist"

      - name: Extract current update notes
        shell: pwsh
        run: |
          $prop = Get-Content module.prop -Raw
          $version = [regex]::Match($prop, '(?m)^version=(.+)$').Groups[1].Value.Trim()
          $notes = Get-Content UPDATE.md -Raw
          $match = [regex]::Match($notes, "(?ms)^##\s+$([regex]::Escape($version))\b.*?\r?\n(?<body>.*?)(?=^##\s+|\z)")
          if (-not $match.Success) { throw "No UPDATE.md section for $version" }
          Set-Content -Path release-notes.md -Value $match.Groups['body'].Value.Trim() -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosbar-navhook-v${{ env.VERSION }}
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*.apk
